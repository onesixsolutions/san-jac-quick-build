# Cortex Analyst Semantic Model — San Jac Enrollment Analytics
# Upload this file to @SAN_JAC_DEMO.CORTEX.ANALYST_STAGE

name: san_jac_enrollment
description: >
  Enrollment and student performance analytics for San Jacinto College demo.
  Supports natural language questions about enrollment counts, course performance,
  and at-risk student identification.

tables:
  - name: ENROLLMENT
    description: Student course enrollment records
    base_table:
      database: SAN_JAC_DEMO
      schema: ANALYTICS
      table: ENROLLMENT
    dimensions:
      - name: student_id
        description: Unique student identifier
        expr: STUDENT_ID
        data_type: VARCHAR
      - name: course_id
        description: Course identifier (e.g. MATH1314)
        expr: COURSE_ID
        data_type: VARCHAR
      - name: term
        description: Academic term (e.g. Spring 2025)
        expr: TERM
        data_type: VARCHAR
      - name: status
        description: Enrollment status (Active, Withdrawn, Completed)
        expr: STATUS
        data_type: VARCHAR
    measures:
      - name: enrollment_count
        description: Number of enrollment records
        expr: COUNT(*)
        data_type: NUMBER
      - name: avg_grade
        description: Average final grade
        expr: AVG(FINAL_GRADE)
        data_type: FLOAT

  - name: ATTENDANCE
    description: Student attendance records by course session
    base_table:
      database: SAN_JAC_DEMO
      schema: ANALYTICS
      table: ATTENDANCE
    dimensions:
      - name: student_id
        expr: STUDENT_ID
        data_type: VARCHAR
      - name: course_id
        expr: COURSE_ID
        data_type: VARCHAR
      - name: session_date
        expr: SESSION_DATE
        data_type: DATE
      - name: attended
        description: Whether the student attended (Y/N)
        expr: ATTENDED
        data_type: VARCHAR
    measures:
      - name: absences
        description: Number of sessions missed
        expr: COUNT_IF(ATTENDED = 'N')
        data_type: NUMBER
