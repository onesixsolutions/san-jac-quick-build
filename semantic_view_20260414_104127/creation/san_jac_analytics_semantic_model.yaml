verified_queries:
  - name: enrollment_headcount_by_term
    question: How many students are enrolled each term, and what is the full-time rate?
    sql: SELECT t.TERM_NAME, COUNT(DISTINCT e.STUDENT_ID) AS enrolled_students, SUM(CASE
      WHEN e.TOTAL_SCH_ATTEMPTED >= 12 THEN 1 ELSE 0 END) AS full_time_count, ROUND(full_time_count
      * 100.0 / enrolled_students, 1) AS full_time_pct FROM fact_enrollment AS e JOIN
      dim_term AS t ON e.TERM_ID = t.TERM_ID GROUP BY t.TERM_NAME ORDER BY t.TERM_NAME
    verified_at: 1776178281
    verified_by: Semantic Model Generator
  - name: demographic_breakdown
    question: What is the demographic breakdown of students by ethnicity and gender?
    sql: SELECT s.ETHNICITY, s.GENDER, COUNT(DISTINCT s.STUDENT_ID) AS student_count,
      ROUND(student_count * 100.0 / SUM(student_count) OVER (), 1) AS pct FROM dim_student
      AS s GROUP BY s.ETHNICITY, s.GENDER ORDER BY student_count DESC
    verified_at: 1776178281
    verified_by: Semantic Model Generator
  - name: course_success_by_term
    question: What is the A-C course success rate and withdrawal rate by term?
    sql: SELECT t.TERM_NAME, ROUND(SUM(CASE WHEN ca.AC_SUCCESS = TRUE THEN 1 ELSE
      0 END) * 100.0 / COUNT(*), 1) AS success_rate, ROUND(SUM(CASE WHEN ca.WITHDREW
      = TRUE THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) AS withdrawal_rate FROM fact_course_attempt
      AS ca JOIN dim_term AS t ON ca.TERM_ID = t.TERM_ID GROUP BY t.TERM_NAME ORDER
      BY t.TERM_NAME
    verified_at: 1776178281
    verified_by: Semantic Model Generator
  - name: top_programs_current_term
    question: Which programs have the most enrolled students in the current term and
      what are their average completed credit hours?
    sql: SELECT p.AREA_OF_STUDY, p.PROGRAM_NAME, COUNT(DISTINCT e.STUDENT_ID) AS enrolled,
      ROUND(AVG(e.TOTAL_SCH_COMPLETED), 1) AS avg_sch_completed FROM fact_enrollment
      AS e JOIN dim_program AS p ON e.PROGRAM_ID = p.PROGRAM_ID JOIN dim_term AS t
      ON e.TERM_ID = t.TERM_ID WHERE t.IS_CURRENT_TERM = TRUE GROUP BY p.AREA_OF_STUDY,
      p.PROGRAM_NAME ORDER BY enrolled DESC
    verified_at: 1776178281
    verified_by: Semantic Model Generator
  - name: financial_aid_by_type
    question: How many students receive each type of financial aid, and what is the
      average award amount and unmet need by aid type?
    sql: SELECT fa.AID_TYPE, COUNT(DISTINCT fa.STUDENT_ID) AS recipients, ROUND(AVG(fa.AID_AMOUNT_AWARDED),
      2) AS avg_awarded, ROUND(AVG(fa.UNMET_NEED), 2) AS avg_unmet_need FROM fact_financial_aid
      AS fa GROUP BY fa.AID_TYPE ORDER BY recipients DESC
    verified_at: 1776178281
    verified_by: Semantic Model Generator
  - name: cpd_completion_by_campus
    question: What are the continuing professional development enrollment counts and
      completion rates by campus and center?
    sql: SELECT c.CAMPUS_NAME, ce.CPD_CENTER, COUNT(*) AS enrollments, ROUND(SUM(CASE
      WHEN ce.COMPLETION_STATUS = 'Completed' THEN 1 ELSE 0 END) * 100.0 / COUNT(*),
      1) AS completion_rate FROM fact_cpd_enrollment AS ce JOIN dim_campus AS c ON
      ce.CAMPUS_ID = c.CAMPUS_ID GROUP BY c.CAMPUS_NAME, ce.CPD_CENTER ORDER BY enrollments
      DESC
    verified_at: 1776178281
    verified_by: Semantic Model Generator
  - name: pell_equity_gap
    question: How do course success and withdrawal rates compare between Pell-eligible
      and non-Pell students?
    sql: SELECT s.PELL_ELIGIBLE, ROUND(SUM(CASE WHEN ca.AC_SUCCESS = TRUE THEN 1 ELSE
      0 END) * 100.0 / COUNT(*), 1) AS success_rate, ROUND(SUM(CASE WHEN ca.WITHDREW
      = TRUE THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) AS withdrawal_rate FROM fact_course_attempt
      AS ca JOIN dim_student AS s ON ca.STUDENT_ID = s.STUDENT_ID GROUP BY s.PELL_ELIGIBLE
    verified_at: 1776178281
    verified_by: Semantic Model Generator
  - name: campus_enrollment_by_term
    question: What is the enrollment headcount and total credit hours attempted by
      campus and term?
    sql: SELECT c.CAMPUS_NAME, t.TERM_NAME, COUNT(DISTINCT e.STUDENT_ID) AS headcount,
      SUM(e.TOTAL_SCH_ATTEMPTED) AS total_sch FROM fact_enrollment AS e JOIN dim_campus
      AS c ON e.CAMPUS_ID = c.CAMPUS_ID JOIN dim_term AS t ON e.TERM_ID = t.TERM_ID
      GROUP BY c.CAMPUS_NAME, t.TERM_NAME ORDER BY c.CAMPUS_NAME, t.TERM_NAME
    verified_at: 1776178281
    verified_by: Semantic Model Generator
  - name: gateway_course_success
    question: What is the success rate for each gateway course ordered by enrollment
      volume?
    sql: SELECT co.COURSE_PREFIX, co.COURSE_TITLE, ROUND(SUM(CASE WHEN ca.AC_SUCCESS
      = TRUE THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) AS success_rate, COUNT(*) AS
      attempts FROM fact_course_attempt AS ca JOIN dim_course AS co ON ca.COURSE_ID
      = co.COURSE_ID WHERE co.IS_GATEWAY = TRUE GROUP BY co.COURSE_PREFIX, co.COURSE_TITLE
      ORDER BY attempts DESC
    verified_at: 1776178281
    verified_by: Semantic Model Generator
  - name: lifecycle_stage_distribution
    question: How many students are in each lifecycle stage and how long have they been
      there on average?
    sql: SELECT ds.STAGE_NAME, COUNT(DISTINCT ssh.STUDENT_ID) AS students_in_stage,
      COUNT(*) AS total_transitions, ROUND(AVG(COALESCE(ssh.DAYS_IN_STAGE, DATEDIFF('day',
      ssh.STAGE_START_DATE, CURRENT_DATE()))), 1) AS avg_days_in_stage FROM fact_student_stage_history
      AS ssh JOIN dim_stage AS ds ON ssh.STAGE_ID = ds.STAGE_ID GROUP BY ds.STAGE_NAME
      ORDER BY ds.STAGE_NAME
    verified_at: 1776178281
    verified_by: CHRIS_HAMMER
  - name: first_gen_success_gap
    question: How do course success and withdrawal rates compare for first-generation
      college students versus non-first-gen?
    sql: SELECT s.FIRST_GEN_COLLEGE, COUNT(DISTINCT ca.STUDENT_ID) AS students,
      ROUND(SUM(CASE WHEN ca.AC_SUCCESS = TRUE THEN 1 ELSE 0 END) * 100.0 / COUNT(*),
      1) AS success_rate, ROUND(SUM(CASE WHEN ca.WITHDREW = TRUE THEN 1 ELSE 0 END)
      * 100.0 / COUNT(*), 1) AS withdrawal_rate FROM fact_course_attempt AS ca JOIN
      dim_student AS s ON ca.STUDENT_ID = s.STUDENT_ID GROUP BY s.FIRST_GEN_COLLEGE
    verified_at: 1776178281
    verified_by: CHRIS_HAMMER
  - name: delivery_mode_outcomes
    question: What are the course success rates, withdrawal rates, and average attendance
      by delivery mode (online, face-to-face, hybrid)?
    sql: SELECT ca.DELIVERY_MODE, COUNT(*) AS attempts, ROUND(SUM(CASE WHEN ca.AC_SUCCESS
      = TRUE THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) AS success_rate, ROUND(SUM(CASE
      WHEN ca.WITHDREW = TRUE THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) AS withdrawal_rate,
      ROUND(AVG(ca.ATTENDANCE_PCT), 1) AS avg_attendance FROM fact_course_attempt AS
      ca GROUP BY ca.DELIVERY_MODE ORDER BY attempts DESC
    verified_at: 1776178281
    verified_by: CHRIS_HAMMER
